# Site settings
title: Ice Blog
SEOTitle: "冰冰洁的博客 | Ice Blog"
author: "韩冰洁"
email: icejie_pingan@qq.com
description: "随便写写"
keyword: "韩冰洁, Ice Blog, 个人博客, Jekyll"
lang: zh-CN
url: "https://bingjie-han.github.io"
baseurl: ""
github_repo: "https://github.com/bingjie-han/bingjie-han.github.io"

# Profile
avatar: /img/1.jpg
sidebar: true
sidebar-about-description: "過過過什么都過"

# Navigation
nav:
  - title: Home
    url: /
  - title: 学习笔记
    url: /notes/
  - title: Blog
    url: /blog/
  - title: Tags
    url: /tags/
  - title: Search
    url: /search/

# Social links
github_username: bingjie-han
zhihu_username: ""
RSS: false

# Build settings
permalink: /:year/:month/:day/:title/
paginate: 6
paginate_path: "/page:num/"
markdown: kramdown
collections:
  notes:
    output: true
    permalink: /notes/:path/
highlighter: rouge
plugins:
  - jekyll-paginate
kramdown:
  input: GFM
  hard_wrap: false

# Comments & Likes — powered by Giscus (GitHub Discussions)
comments:
  enable: true

giscus:
  repo: "bingjie-han/bingjie-han.github.io"
  repo_id: "R_kgDOSEAVBQ"
  category: "Comments"         # 分类名需与 giscus.app 所选一致；请用「Open-ended discussion」格式的分类（默认 Announcements 仅维护者可新建讨论，会导致访客首条评论失败）
  category_id: "DIC_kwDOSEAVBc4DFWv9"
  mapping: "pathname"
  reactions_enabled: "1"       # 开启反应（即点赞）
  emit_metadata: "1"           # 向页面回传评论/反应数据，供独立点赞按钮显示计数
  input_position: "top"
  theme: "light"
  lang: "zh-CN"
  loading: "lazy"

# Gitalk 已弃用（如要切换回来，自行注册 OAuth 应用）
gitalk:
  enable: false
  clientID: ""
  clientSecret: ""
  repo: "bingjie-han.github.io"
  owner: "bingjie-han"
  admin: "bingjie-han"
  distractionFreeMode: true

disqus_username: ""

# Featured Tags
featured-tags: true
featured-condition-size: 0

# Progressive Web App
chrome-tab-theme-color: "#0a2f7a"
service-worker: true

# Friends
friends:
  - title: GitHub
    href: "https://github.com/bingjie-han"
  - title: Apple Developer
    href: "https://developer.apple.com/"

exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - package.json
  - README.md
